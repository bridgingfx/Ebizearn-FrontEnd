    <!-- Typography: Apple system font stack (SF Pro on Apple devices, Segoe UI on Windows, Roboto on Android) — no webfont download needed -->

    <!-- Set the theme class pre-paint to avoid a light/dark flash. Mirrors ThemeContext. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('ebizearn-theme');
          if (t !== 'dark' && t !== 'light') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          if (t === 'dark') document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
