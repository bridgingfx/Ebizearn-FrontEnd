<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Complete simple online tasks, promote real brands, help businesses grow, and earn money — anytime, anywhere. 100% free to join." />
    <meta name="theme-color" content="#07182F" />
    <title>eBizEarn — Verified Tasks. Global Opportunities.</title>
    
    <!-- Typography: Apple system font stack (SF Pro on Apple devices, Segoe UI on Windows, Roboto on Android) — no webfont download needed -->

    <!-- Set the theme class pre-paint to avoid a light/dark flash. Mirrors ThemeContext. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('ebizearn-theme');
          if (t !== 'dark' && t !== 'light') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          if (t === 'dark') document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F7F9FC] text-[#101828] dark:bg-[#0B0F19] dark:text-[#E8ECF3] font-sans antialiased selection:bg-[#168BFF]/20 selection:text-[#168BFF]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
